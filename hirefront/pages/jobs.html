<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs - EmployNet</title>
  <!-- Global and Jobs Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/jobs.css">
</head>
<body>

  <!-- Shared Header Navbar -->
  <nav class="navbar"></nav>

  <main class="container">
    <!-- Hero banner -->
    <section class="jobs-hero">
      <h1>Discover Your Next Career Step</h1>
      <p>Explore thousands of jobs in technology, marketing, design, and engineering posted by world-class companies.</p>
    </section>

    <!-- Filters Dashboard Card -->
    <section class="filter-card">
      <form id="jobs-filter-form" class="filter-grid">
        <div class="filter-group">
          <label for="search-input">Search Keywords</label>
          <input type="text" id="search-input" class="filter-input" placeholder="Title, description, or tech...">
        </div>
        <div class="filter-group">
          <label for="location-input">Location</label>
          <input type="text" id="location-input" class="filter-input" placeholder="e.g. Remote, New York">
        </div>
        <div class="filter-group">
          <label for="salary-input">Min Salary ($)</label>
          <input type="number" id="salary-input" class="filter-input" placeholder="e.g. 80000" min="0">
        </div>
        <button type="submit" class="btn btn-primary" style="height: 46px;">
          Search
        </button>
      </form>
    </section>

    <!-- Actions & Stats Header -->
    <div class="jobs-header-actions">
      <div class="jobs-count" id="jobs-count-text">Showing 0 active jobs</div>
      <button class="btn btn-outline hidden" id="post-job-nav-btn">
        Post a Job Listing
      </button>
    </div>

    <!-- Active Job Listing Cards -->
    <section class="jobs-grid" id="jobs-cards-grid">
      <!-- Cards injected by JS -->
      <div class="no-jobs-container">
        <span class="spinner" style="width: 40px; height: 40px;"></span>
        <p>Loading active job listings...</p>
      </div>
    </section>
  </main>

  <!-- Global Footer -->
  <footer>
    <p>&copy; 2026 EmployNet Inc. All rights reserved.</p>
  </footer>

  <!-- Script Modules -->
  <script type="module" src="../js/jobs.js"></script>
</body>
</html>
